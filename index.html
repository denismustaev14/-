<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Колькулятор</title>
    <link rel="icon" type="image/png" href="https://static.vecteezy.com/system/resources/previews/008/089/669/non_2x/calculator-icons-calculator-icon-design-illustration-calculator-icon-isolated-on-white-background-calculator-icon-simple-sign-free-vector.jpg">
    <link rel="stylesheet" href="ночной гиперфиксv2.css" />
  </head>
  <body>
    <div class="container">
      <div class="button">
        <button class="btn-voice-full">сорт. голос фулл(20.5)</button>
        <button class="btn-voice-call">сорт. голос звонок (17.5)</button>
        <button class="btn-voice-nto">сорт голос нто (3)</button>
        <button class="btn-email">письмо (7.5)</button>
        <button class="btn-voice-pro">проф. голос (30)</button>
        <button class="btn-undo">отмена</button>
      </div>
      <div class="result">
        <div class="stats-row">
          <div class="stats-row">
            <button class="btn-sync">↓</button>
            <h1 class="result_text">0</h1>
          </div>
          <h2 class="diff">0</h2>
        </div>
        <h2 class="saved"></h2>
      </div>
    </div>
    <button class="btn-reset-all">⟳</button>
    <script src="script.js"></script>
  </body>
</html>
